<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Level 1 - Boss 1</title>
    <link rel="stylesheet" href="shared/game.css">
</head>

<body>

    <!-- CABINET AREA -->
    <div id="game-area">

        <img id="game-image" src="assets/images/Zoomed In Screen.png" alt="Level 1 Cabinet">

        <div id="fadeOut"></div>

        <div id="overlay-layer">
            <img id="btnA" class="small-item stick-neutral" src="assets/images/buttons.png"
                style="top: 800px; left: 500px;" alt="arcade buttons">
            <img id="rightStick" class="small-item stick-neutral" src="assets/images/rightStick.png"
                style="top: 685px; left: 875px;" alt="right joystick">
            <img id="leftStick" class="small-item stick-neutral" src="assets/images/leftStick.png"
                style="top: 685px; left: 445px;" alt="left joystick">
        </div>

        <button id="homeBtn" onclick="window.location.href='index.html'">Main Menu</button>

    </div>


    <!-- FLOATING CRT WINDOW -->
    <div id="gameWrapper">

        <!-- HUD -->
        <div id="hudBar">
            <span id="scoreDisplay" style="display:none;">Score: 0</span>
            <span id="killDisplay" style="display:none;">Enemies: 0 / 0</span>
        </div>

        <!-- PLAYER HEALTH -->
        <div id="playerHealthBarContainer" style="display:none;">
            <div id="playerHealthBar"></div>
        </div>

        <!-- BOSS HEALTH -->
        <div id="boss1HealthBarContainer" class="boss-health-container" style="display:none;">
            <div class="boss-health-label">BOSS 1</div>
            <div class="boss-health-bar-bg">
                <div id="boss1HealthBar" class="boss-health-bar-fill" style="background:#ff4444;"></div>
            </div>
        </div>

        <!-- CANVAS -->
        <canvas id="gameCanvas" width="650" height="500"></canvas>

        <!-- START OVERLAY -->
        <div id="startOverlay" class="overlay" style="display:flex;">
            <button id="startButton">Start Level 1</button>
        </div>

        <!-- SHOP OVERLAY (Unified) -->
        <div id="upgradeOverlay" class="overlay" style="display:none;">
            <div class="upgrade-panel">
                <h2>Upgrade Shop</h2>
                <p>Buy as many upgrades as you can afford.</p>

                <button id="upgradeLaser">Laser</button>
                <button id="upgradeForcefield">Forcefield</button>
                <button id="upgradeBulletSpeed">Bullet Speed</button>
                <button id="upgradeHealth">Max Health</button>
                <button id="upgradeMoveSpeed">Move Speed</button>
                <button id="upgradeContinue">Continue to Boss</button>

                <p id="shopMessage" style="margin-top:10px; color:#ff8080;"></p>
            </div>
        </div>

        <!-- VICTORY -->
        <div id="victoryOverlay" class="overlay">
            <h1>MISSION COMPLETE</h1>
            <p>You defeated Boss 1!</p>
            <button onclick="window.location.href='level2.html'">Next Mission</button>
        </div>

        <!-- GAME OVER -->
        <div id="gameOverOverlay" class="overlay">
            <h1>GAME OVER</h1>
            <p>Your mission has failed.</p>
            <button id="gameOverButton">Try Again</button>
        </div>

    </div>


    <!-- CANVAS SETUP -->
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
    </script>

    <!-- GAME SCRIPTS (Correct Order) -->
    <script src="shared/joystick.js"></script>
    <script src="shared/player.js"></script>
    <script src="shared/enemies.js"></script>
    <script src="shared/collisions.js"></script>

    <!-- Correct weapons file -->
    <script src="shared/weapons.js"></script>


    <!-- Unified upgrades system -->
    <script src="shared/upgrades.js"></script>

    <!-- Boss -->
    <script src="bosses/boss1.js"></script>

    <!-- Level Loop -->
    <script src="loops/level1Loop.js"></script>

</body>

</html>
